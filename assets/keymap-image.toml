# The image preview's own keys.
#
# Read as an overlay in front of the ordinary keymap, while a split shows an image and has the
# keyboard. The camera keys are the stage's; the edit keys are the image's. The base map layers
# underneath, so `]b`, `<C-h>` and the rest keep working.

[[map]]
mode = ["n"]
keys = "+"
action = "stage.zoom_in"
desc = "Zoom in"

[[map]]
mode = ["n"]
keys = "="
action = "stage.zoom_in"

[[map]]
mode = ["n"]
keys = "-"
action = "stage.zoom_out"
desc = "Zoom out"

[[map]]
mode = ["n"]
keys = "0"
action = "stage.fit"
desc = "Fit to the split"

[[map]]
mode = ["n"]
keys = "1"
action = "stage.actual"
desc = "Actual size"

[[map]]
mode = ["n"]
keys = "h"
action = "stage.pan_left"
desc = "Pan left"

[[map]]
mode = ["n"]
keys = "l"
action = "stage.pan_right"
desc = "Pan right"

[[map]]
mode = ["n"]
keys = "k"
action = "stage.pan_up"
desc = "Pan up"

[[map]]
mode = ["n"]
keys = "j"
action = "stage.pan_down"
desc = "Pan down"

[[map]]
mode = ["n"]
keys = "<Left>"
action = "stage.pan_left"

[[map]]
mode = ["n"]
keys = "<Right>"
action = "stage.pan_right"

[[map]]
mode = ["n"]
keys = "<Up>"
action = "stage.pan_up"

[[map]]
mode = ["n"]
keys = "<Down>"
action = "stage.pan_down"

[[map]]
mode = ["n"]
keys = "e"
action = "image.edit"
desc = "Toggle the edit tools"

[[map]]
mode = ["n"]
keys = "c"
action = "image.crop"
desc = "Crop"

[[map]]
mode = ["n"]
keys = "r"
action = "image.rotate_cw"
desc = "Rotate clockwise"

[[map]]
mode = ["n"]
keys = "R"
action = "image.rotate_ccw"
desc = "Rotate counter-clockwise"

[[map]]
mode = ["n"]
keys = "H"
action = "image.flip_h"
desc = "Flip horizontal"

[[map]]
mode = ["n"]
keys = "V"
action = "image.flip_v"
desc = "Flip vertical"

[[map]]
mode = ["n"]
keys = "<CR>"
action = "image.apply"
desc = "Apply and write"

[[map]]
mode = ["n"]
keys = "u"
action = "image.discard"
desc = "Discard the edits"

[[map]]
mode = ["n"]
keys = "<Esc>"
action = "image.escape"
