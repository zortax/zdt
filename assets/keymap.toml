# AstroNvim puts these on `>b` and `<b`, which cannot work here: `>` and `<` are the indent
# operators, so `>b` is *indent back a word* and a binding that shadowed it would take a core vim
# command away. They live in the buffer group instead.
[[map]]
mode = ["n"]
keys = "<Leader>b<gt>"
action = "buffer.move"
args = { offset = 1 }
desc = "Move buffer right"

[[map]]
mode = ["n"]
keys = "<Leader>b<lt>"
action = "buffer.move"
args = { offset = -1 }
desc = "Move buffer left"

