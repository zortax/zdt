# The drawing editor's own keys.
#
# Read as an overlay in front of the ordinary keymap, while a split shows a drawing and has the
# keyboard. The base map layers underneath, so `]b`, `<C-h>` and the rest keep working.

# --- the tools -----------------------------------------------------------------------------

[[map]]
mode = ["n"]
keys = "v"
action = "excalidraw.select"
desc = "Select"

[[map]]
mode = ["n"]
keys = "1"
action = "excalidraw.select"

[[map]]
mode = ["n"]
keys = "2"
action = "excalidraw.rectangle"

[[map]]
mode = ["n"]
keys = "3"
action = "excalidraw.diamond"

[[map]]
mode = ["n"]
keys = "4"
action = "excalidraw.ellipse"

[[map]]
mode = ["n"]
keys = "5"
action = "excalidraw.arrow"

[[map]]
mode = ["n"]
keys = "6"
action = "excalidraw.line"

[[map]]
mode = ["n"]
keys = "7"
action = "excalidraw.freedraw"

[[map]]
mode = ["n"]
keys = "8"
action = "excalidraw.text"

[[map]]
mode = ["n"]
keys = "9"
action = "excalidraw.image"

[[map]]
mode = ["n"]
keys = "0"
action = "excalidraw.eraser"

[[map]]
mode = ["n"]
keys = "h"
action = "excalidraw.hand"
desc = "Pan"

[[map]]
mode = ["n"]
keys = "r"
action = "excalidraw.rectangle"
desc = "Rectangle"

[[map]]
mode = ["n"]
keys = "d"
action = "excalidraw.diamond"
desc = "Diamond"

[[map]]
mode = ["n"]
keys = "o"
action = "excalidraw.ellipse"
desc = "Ellipse"

[[map]]
mode = ["n"]
keys = "a"
action = "excalidraw.arrow"
desc = "Arrow"

[[map]]
mode = ["n"]
keys = "l"
action = "excalidraw.line"
desc = "Line"

[[map]]
mode = ["n"]
keys = "n"
action = "excalidraw.freedraw"
desc = "Draw by hand"

[[map]]
mode = ["n"]
keys = "t"
action = "excalidraw.text"
desc = "Write"

[[map]]
mode = ["n"]
keys = "i"
action = "excalidraw.image"
desc = "Place a picture"

[[map]]
mode = ["n"]
keys = "f"
action = "excalidraw.frame"
desc = "Frame"

[[map]]
mode = ["n"]
keys = "e"
action = "excalidraw.eraser"
desc = "Rub out"

# --- the view ------------------------------------------------------------------------------

[[map]]
mode = ["n"]
keys = "+"
action = "excalidraw.zoom_in"
desc = "Zoom in"

[[map]]
mode = ["n"]
keys = "="
action = "excalidraw.zoom_in"

[[map]]
mode = ["n"]
keys = "-"
action = "excalidraw.zoom_out"
desc = "Zoom out"

[[map]]
mode = ["n"]
keys = "!"
action = "excalidraw.fit"
desc = "Fit the drawing"

[[map]]
mode = ["n"]
keys = "<C-0>"
action = "excalidraw.actual"
desc = "Actual size"

[[map]]
mode = ["n"]
keys = "<C-h>"
action = "excalidraw.pan_left"

[[map]]
mode = ["n"]
keys = "<C-l>"
