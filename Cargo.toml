[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Leonard Seibold"]
repository = "https://github.com/zortax/zdt"

[workspace.dependencies]

# --- the framework and the two components it is built from -------------------------------
zgui = { git = "https://github.com/zortax/zgui", features = ["tokio"] }
zgui-ui = { git = "https://github.com/zortax/zgui" }
zgui-ui-tokens = { git = "https://github.com/zortax/zgui" }
zgui-ui-icons = { git = "https://github.com/zortax/zgui" }
zgui-ui-primitives = { git = "https://github.com/zortax/zgui" }
zgui-editor = { path = "/home/leo/Projects/zgui-editor", features = ["serde"] }
zgui-terminal = { path = "/home/leo/Projects/zgui-terminal", features = ["pty"] }
portable-pty = "0.9"

# --- this workspace ----------------------------------------------------------------------
zdt-core = { path = "crates/zdt-core" }
zdt-vim = { path = "crates/zdt-vim" }
zdt-lsp = { path = "crates/zdt-lsp" }
zdt-git = { path = "crates/zdt-git" }
zdt-view = { path = "crates/zdt-view" }
zdt-icons = { path = "crates/zdt-icons" }
zdt-gitui = { path = "crates/zdt-gitui" }
zdt-ipc = { path = "crates/zdt-ipc" }

# --- text --------------------------------------------------------------------------------
ropey = "1.6"
regex = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

# --- search ------------------------------------------------------------------------------
nucleo = "0.5"
nucleo-matcher = "0.3"
# 0.4.30 is where `WalkBuilder::build_matchers` arrives, which is what lets the tree ask about one
# path at a time rather than walk to find out.
ignore = "0.4.33"
grep-searcher = "0.1"
grep-regex = "0.1"
regex-syntax = "0.8"
grep-matcher = "0.1"

# --- language ----------------------------------------------------------------------------
tree-sitter = "0.26"
async-lsp = { version = "0.2", features = ["tokio"] }
lsp-types = "0.95"
tower = "0.5"

# --- git ---------------------------------------------------------------------------------
# Reads are gix: a commit graph walked in-process beats one commit per `git show`, and staging a
# single hunk means rewriting an index entry's blob, which is an object-store operation rather
# than something to express in command-line flags.
# Only what the panel asks: no network transports, no credential helpers, no progress units. The
# hash backend is a feature of its own and is not optional — without `sha1` the crate does not
# compile, which is a clearer error than most.
gix = { version = "0.85", default-features = false, features = [
    "sha1",
    "max-performance-safe",
    "blob-diff",
    "status",
    "index",
    "revision",
    "dirwalk",
    "parallel",
] }

# --- platform ----------------------------------------------------------------------------
tokio = { version = "1", features = ["process", "io-util", "rt", "macros", "sync", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
notify = "8"
notify-debouncer-full = "0.5"
dirs = "6"
libloading = "0.8"

# --- data --------------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.9"
slotmap = "1"
smallvec = "1"
rustc-hash = "2"
compact_str = "0.10"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
uninlined_format_args = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
