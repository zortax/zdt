# The keymap zdt starts with.
#
# Everything is here, including the motions and the operators: `w` is a row in this file exactly
# as `<Leader>ff` is, so any of it can be moved or taken away without recompiling. Your own
# `keymap.toml` in the configuration directory is read after this one, and a row in it that names
# the same keys in the same modes replaces the one here. `action = false` takes a binding away.
#
# Modes are vim's letters: n normal, i insert, r replace, v every visual mode, x the character and
# line ones, b the block one, s select, o operator-pending, c the command line, t terminal, a all
# of them.
#
# Two things are *not* here, because they are grammar rather than bindings: a count typed before a
# command, and the `"x` that picks a register. Making digits rebindable would mean nothing.
#
# The leader is <Space> and the local leader is , — both set in `config.toml`.

[groups]
"<Leader>b" = "Buffers"
"<Leader>bs" = "Sort Buffers"
"<Leader>d" = "Debugger"
"<Leader>f" = "Find"
"<Leader>g" = "Git"
"<Leader>l" = "Language Tools"
"<Leader>p" = "Packages"
"<Leader>S" = "Session"
"<Leader>t" = "Terminal"
"<Leader>u" = "UI/UX"
"<Leader>x" = "Quickfix/Lists"
"g" = "Go to"
"z" = "View"
"[" = "Previous"
"]" = "Next"

# ---- Motions ---------------------------------------------------------------------------------

[[map]]
mode = ["n", "x", "o"]
keys = "h"
action = "motion.left"
desc = "Left"

[[map]]
mode = ["n", "x", "o"]
keys = "l"
action = "motion.right"
desc = "Right"

# Down and up move by what is on screen when no count was typed, which is what makes a wrapped
# line one press rather than one press per screen row.
[[map]]
mode = ["n", "x", "o"]
keys = "j"
action = "motion.down"
desc = "Down"

[[map]]
mode = ["n", "x", "o"]
keys = "k"
action = "motion.up"
desc = "Up"

[[map]]
