[[map]]
mode = ["n"]
keys = "<C-k>"
action = "excalidraw.pan_up"

[[map]]
mode = ["n"]
keys = "<C-j>"
action = "excalidraw.pan_down"

# --- the selection -------------------------------------------------------------------------

[[map]]
mode = ["n"]
keys = "<C-a>"
action = "excalidraw.select_all"
desc = "Select everything"

[[map]]
mode = ["n"]
keys = "x"
action = "excalidraw.delete"
desc = "Delete the selection"

[[map]]
mode = ["n"]
keys = "<Del>"
