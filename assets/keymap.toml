# The same four without the prefix, which is what smart-splits binds and what a hand that is
# already moving expects.
[[map]]
mode = ["n", "t"]
keys = "<C-h>"
action = "window.focus"
args = { direction = "left" }
desc = "Window left"

[[map]]
mode = ["n", "t"]
keys = "<C-j>"
action = "window.focus"
args = { direction = "down" }
desc = "Window below"

[[map]]
mode = ["n", "t"]
keys = "<C-k>"
action = "window.focus"
args = { direction = "up" }
desc = "Window above"

[[map]]
mode = ["n", "t"]
keys = "<C-l>"
action = "window.focus"
args = { direction = "right" }
desc = "Window right"

# The text in this window alone, which is what a person zooming a split is asking for.
[[map]]
