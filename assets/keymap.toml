keys = "<C-=>"
action = "window.zoom"
args = { step = 1 }
desc = "Larger text"

[[map]]
mode = ["n", "i", "x", "t"]
keys = "<C-->"
action = "window.zoom"
args = { step = -1 }
desc = "Smaller text"

[[map]]
mode = ["n", "i", "x", "t"]
keys = "<C-0>"
action = "window.zoom"
args = { step = 0 }
desc = "Reset text size"

